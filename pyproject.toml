[project]
name = "miit-scraper"
version = "0.1.0"
description = "爬取工信部时政要闻文章，输出格式化 Markdown"
readme = "README.md"
authors = [
    { name = "钊 李", email = "3411213374@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
miit-scraper = "miit_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
